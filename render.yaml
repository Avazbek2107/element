databases:
  - name: element-db
    databaseName: crm_db
    user: crm_user
    plan: free

services:

  # ── Backend (FastAPI) ──────────────────────────────────────────────
  - type: web
    name: element-backend
    runtime: python
    rootDir: crm/backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: sh entrypoint.sh
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: element-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 60
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: 7
      - key: TZ
        value: Asia/Tashkent
      - key: ALLOWED_ORIGINS
        value: https://element-frontend.onrender.com
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false

  # ── Frontend (React/Vite → static) ────────────────────────────────
  - type: web
    name: element-frontend
    runtime: static
    rootDir: crm/frontend
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://element-backend.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # ── Telegram Bot (background worker) ──────────────────────────────
  - type: worker
    name: element-bot
    runtime: python
    rootDir: crm/bot
    plan: free
    buildCommand: pip install aiogram httpx
    startCommand: python bot.py
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: BACKEND_URL
        value: https://element-backend.onrender.com
